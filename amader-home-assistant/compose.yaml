services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amader_home_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-amader_home_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - amader-home-assistant-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amader_home_assistant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amader_home_assistant}
      PAIRING_CODE: ${PAIRING_CODE:?set PAIRING_CODE in .env}
      DOORBELL_HMAC_SECRETS: ${DOORBELL_HMAC_SECRETS:?set DOORBELL_HMAC_SECRETS in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      HMAC_MAX_AGE_SECONDS: ${HMAC_MAX_AGE_SECONDS:-300}
      MAX_INGEST_BODY_BYTES: ${MAX_INGEST_BODY_BYTES:-16384}
      CAMERA_BASE_URL: ${CAMERA_BASE_URL:-https://camera.souptik.dev}
      IOS_CRITICAL_ALERTS_ENABLED: ${IOS_CRITICAL_ALERTS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8787}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  amader-home-assistant-db:
