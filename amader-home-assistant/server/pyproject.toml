[project]
name = "amader-home-assistant-server"
version = "0.1.0"
description = "API server for the Amader Home Assistant doorbell platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "firebase-admin>=7.1,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amader_home_assistant"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint]
extend-ignore = ["B008"] # FastAPI uses Depends/Header/Query in parameter defaults.
